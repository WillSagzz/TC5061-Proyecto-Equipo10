[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Proyecto MiBici"
authors = [
  { name = "TC5061-Equipo10" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10.0"

# Plugin de MLflow que elige el experimento de cada `mlflow run` (mibici/experiments.py)
[project.entry-points."mlflow.default_experiment_provider"]
mibici = "mibici.experiments:ProjectExperimentProvider"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py", "infra/scripts/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

# Análisis estático de seguridad: `make security` ejecuta `bandit -c pyproject.toml -r ...`
# sobre mibici, infra/scripts, docs/entregas/build.py y tests (los mismos paths que el workflow
# de GitHub Actions). Estas exclusiones protegen a quien corre `bandit -c pyproject.toml -r .`
# desde la raíz: bandit ignora .gitignore y escanearía los miles de archivos de site-packages.
[tool.bandit]
exclude_dirs = [
    "*/.venv/*",                 # entorno virtual recomendado en el README
    "*/venv/*",                  # entornos virtuales con otro nombre
    "*/notebooks/*",             # exploración; la lógica final vive en mibici/
    "*/docs/entregas/*/build/*", # salidas compiladas de las entregas (ignoradas por Git)
]

# B101: los `assert` son la forma normal de verificar en PyTest, así que no se reportan en tests/.
# En el resto del código sí cuentan (python -O los elimina), de ahí el cambio en check_server.py.
[tool.bandit.assert_used]
skips = ["tests/*", "*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:typer.*",
    "ignore::DeprecationWarning:deepchecks.*",
    "ignore::FutureWarning:deepchecks.*",
    "ignore::DeprecationWarning:matplotlib.*",
]