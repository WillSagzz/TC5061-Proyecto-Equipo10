[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Proyecto MiBici"
authors = [
  { name = "TC5061-Equipo10" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10.0"

# Proveedor del experimento por defecto de MLflow: cuando el proyecto corre con `mlflow run`
# sin --experiment-name, elige el experimento de la pregunta (ver mibici/experiments.py).
# Se registra al instalar el paquete (`pip install -e .`).
[project.entry-points."mlflow.default_experiment_provider"]
mibici = "mibici.experiments:ProjectExperimentProvider"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py", "infra/scripts/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

